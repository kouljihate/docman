<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ company.company_name if company else _('app_name') }}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/cosmo/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
        // Pick one of the bundled trianglify images per page load and expose it
        // to app.css as the body backdrop.
        (function () {
            var images = ['trianglify1.png', 'trianglify2.png', 'trianglify3.png',
                          'trianglify4.png', 'trianglify5.png', 'trianglify6.png',
                          'trianglify7.png', 'trianglify8.png', 'trianglify9.png',
                          'trianglify10.png'];
            var pick = images[Math.floor(Math.random() * images.length)];
            document.documentElement.style.setProperty('--app-bg', 'url("/static/img/' + pick + '")');
        })();
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div id="app-loader" class="app-loader is-visible" role="status" aria-live="polite" aria-label="{{ _('loading') }}">
        <img src="/static/img/loader.gif" alt="{{ _('loading') }}" width="120" height="120">
    </div>

    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script>
        // Strings the shared table paginator needs; app.js is static, so the
        // translated labels are handed over from the server here.
        window.APP_I18N = {
            paginationPrev: {{ _('pagination_prev')|tojson }},
            paginationNext: {{ _('pagination_next')|tojson }},
            paginationInfo: {{ _('pagination_info')|tojson }},
            paginationLabel: {{ _('pagination_label')|tojson }},
        };
    </script>
    <script src="/static/js/app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
