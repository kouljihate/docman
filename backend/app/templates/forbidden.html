{% extends "dashboard_base.html" %}

{% block title %}{{ _('forbidden') }} - {{ company.company_name if company else _('app_name') }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-shield-lock text-danger" style="font-size:3rem"></i>
    <h4 class="mt-3 fw-bold">{{ _('forbidden') }}</h4>
    <p class="text-muted">{{ _('forbidden_hint') }}</p>
    <a href="/dashboard" class="btn btn-cse mt-2"><i class="bi bi-arrow-left me-1"></i>{{ _('back') }}</a>
</div>
{% endblock %}
